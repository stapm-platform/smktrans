url: https://stapm-platform.github.io/smktrans/

template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    in_header: |
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&display=swap">
      <!-- Google Analytics: same GA4 property as the main STAPM site, so package
           site visits count towards the same totals. The old params.ganalytics
           entry was a Universal Analytics ID, retired by Google in 2023. -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q4RP5QG31C"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Q4RP5QG31C');
      </script>

authors:
  Duncan Gillespie:
    href: https://sheffield.ac.uk/smph/duncan-gillespie
  Alan Brennan:
    href: https://sheffield.ac.uk/smph/people/academic/population-health/alan-brennan

navbar:
  structure:
    left:  [home, intro, reference, articles, news]
    right: [github]
  components:
    home: ~
    intro:
      text: Get started
      href: articles/smktrans.html
    reference:
      text: Functions
      href: reference/index.html
    articles:
      text: Articles
      menu:
        - text: Regional Estimates
        - text: England Report
          href: articles/report_england.html
        - text: Scotland Report
          href: articles/report_scotland.html
        - text: Wales Report
          href: articles/report_wales.html
        - text: "---"
        - text: Technical documentation
        - text: Estimation workflow
          href: articles/smk_trans_prob_estimation.html
        - text: "Validation: England"
          href: articles/validation_england.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/stapm-platform/smktrans
      aria-label: GitHub

